name: Build HermesEnabler IPA (watchOS 26.6.1 + PR93)

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'iOS companion bundle ID (watch ID becomes IDENTIFIER.watchkitapp)'
        required: true
        default: 'com.custom.HermesEnabler'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hermes-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          echo "--- SDKs ---"
          xcodebuild -showsdks || true
          echo "--- watchOS platform ---"
          xcodebuild -showsdks 2>/dev/null | grep -i watchos || echo "::error::watchOS SDK not found"

      - name: Verify PR93 sources are present
        run: |
          set -euo pipefail
          for f in HermesEnabler2/BQOriginalHermes.h \
                   HermesEnabler2/BQOriginalHermes.m \
                   HermesEnabler2/OriginalHermesView.swift; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          grep -q "Original Hermès (App Only)" HermesEnabler2/WatchFacesView.swift \
            || { echo "::error::Original Hermès entry missing from WatchFacesView"; exit 1; }
          echo "OK: PR93 sources in place"

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          chmod +x scripts/create_ipa.sh
          ./scripts/create_ipa.sh \
            --bundle-id "${{ inputs.bundle_id || 'com.custom.HermesEnabler' }}" \
            --output "build/ipa/HermesEnabler-watchOS26.6.1.ipa"

      - name: Verify embedded Watch app
        run: |
          set -euo pipefail
          ls -lh build/ipa/
          unzip -l "build/ipa/HermesEnabler-watchOS26.6.1.ipa" | tee /tmp/ipa-list.txt
          grep -E "Payload/HermesCompanion\.app/Watch/[^/]+\.app/" /tmp/ipa-list.txt > /dev/null \
            || { echo "::error::embedded Watch app missing from IPA"; exit 1; }
          if grep -q "embedded.mobileprovision" /tmp/ipa-list.txt; then
            echo "::error::provisioning profile present, IPA is not unsigned"
            exit 1
          fi
          rm -rf /tmp/ipa-x && mkdir -p /tmp/ipa-x
          unzip -q "build/ipa/HermesEnabler-watchOS26.6.1.ipa" -d /tmp/ipa-x
          WATCH_PLIST="$(find /tmp/ipa-x/Payload/HermesCompanion.app/Watch -maxdepth 2 -name Info.plist -print -quit)"
          echo "--- watch Info.plist ---"
          /usr/libexec/PlistBuddy -c "Print" "$WATCH_PLIST"
          /usr/libexec/PlistBuddy -c "Print :WKSupportsAlwaysOnDisplay" "$WATCH_PLIST" > /dev/null \
            || { echo "::error::WKSupportsAlwaysOnDisplay missing"; exit 1; }
          echo "OK: unsigned IPA with nested Watch app + Always-On support"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HermesEnabler-watchOS26.6.1-WatchBridge
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
